# Checks every pull request and every push to main: lint, formatting, types,
# migrations against the schema, the docs, all Vitest suites (unit, db,
# integration, component, security) and a production build. Needs no secrets:
# tests use an in-memory Postgres and strip app settings, and `next build` runs
# without environment variables.
# The e2e job runs the browser tests against a production build with its own
# throwaway Postgres (D-032); it needs no secrets either.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps need no git access
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (lockfile must match package.json)
        run: pnpm install --frozen-lockfile
      # The same rule as the pre-push hook, enforced here because hooks can be skipped.
      - name: Branch name
        if: github.event_name == 'pull_request'
        run: node scripts/check-branch-name.mjs "$GITHUB_HEAD_REF"
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Migrations match the schema
        run: pnpm db:check
      - name: Docs links, paths and commands resolve
        run: pnpm docs:check
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      # Known high or critical advisories in any dependency fail the run
      # (moderate ones are reviewed by hand; see docs/project-memory/known-issues.md).
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ github.run_number }}
          path: test-*.log
          if-no-files-found: ignore
          retention-days: 7

  # Browser tests (Playwright) against a production build: only there do pages
  # render as they do live (D-027). A throwaway Postgres in a container, a secret
  # made for this run only, and placeholder Google keys: the tests sign in with
  # Better Auth's test helpers. Tests that need payments or an AI key skip
  # themselves. No repository secrets.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clearpaisa
          POSTGRES_PASSWORD: clearpaisa # a throwaway container, not a secret
          POSTGRES_DB: clearpaisa_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clearpaisa -d clearpaisa_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PW_PROD: "1"
      DATABASE_URL: postgresql://clearpaisa:clearpaisa@localhost:5432/clearpaisa_e2e
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps need no git access
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (lockfile must match package.json)
        run: pnpm install --frozen-lockfile
      - name: A sign-in secret for this run only
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Database schema
        run: pnpm db:migrate
      - name: Browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      # Desktop and phone; the tablet project only takes tour screenshots.
      - name: Browser tests
        run: pnpm test:e2e --project desktop-chrome --project mobile-safari
      - name: Keep the log and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ github.run_number }}
          path: |
            test-e2e.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
