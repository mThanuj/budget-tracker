# Weekly dependency audit, so an advisory published while nothing is being
# merged still fails a run (GitHub emails the owner). Pull requests and pushes
# to main are audited in ci.yml too (D-023, D-034).
name: Weekly dependency audit

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 8:30 in India
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads the lockfile; no install needed. High or critical fails the run.
      - name: Dependency audit
        run: pnpm audit --audit-level=high
